<svg width="100%" viewBox="0 0 680 270" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Push vs pull muscle groups</title>
<desc>A diagram showing that pushing exercises target the triceps, chest, and shoulders, while pulling exercises target the biceps, back, and forearms.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Pull header -->
<rect x="60" y="16" width="220" height="40" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="170" y="36" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#111111">Pull</text>

<!-- Push header -->
<rect x="400" y="16" width="220" height="40" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="510" y="36" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#111111">Push</text>

<!-- Arrows down to first row -->
<line x1="170" y1="56" x2="170" y2="97" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="56" x2="510" y2="97" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Pull side boxes -->
<rect x="60" y="100" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="170" y="123" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Biceps</text>

<rect x="60" y="156" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="170" y="179" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Back</text>

<rect x="60" y="212" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="170" y="235" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Forearms</text>

<!-- Push side boxes -->
<rect x="400" y="100" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="510" y="123" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Triceps</text>

<rect x="400" y="156" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="510" y="179" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Chest</text>

<rect x="400" y="212" width="220" height="46" fill="#F5A623" stroke="#000000" stroke-width="2"/>
<text x="510" y="235" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111">Shoulders</text>
</svg>
