<svg width="100%" viewBox="0 0 680 270" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Push vs pull muscle groups</title>
<desc>A diagram showing that pushing exercises target the triceps, chest, and shoulders, while pulling exercises target the biceps, back, and forearms.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="60" y="16" width="220" height="40" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="170" y="36" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14" font-weight="500">Pull</text>
</g>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="400" y="16" width="220" height="40" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="510" y="36" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14" font-weight="500">Push</text>
</g>

<line x1="170" y1="56" x2="170" y2="97" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="56" x2="510" y2="97" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)"/>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="60" y="100" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="170" y="118" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Biceps</text>
</g>
<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="60" y="146" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="170" y="164" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Back</text>
</g>
<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="60" y="192" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="170" y="210" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Forearms</text>
</g>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="400" y="100" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="510" y="118" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Triceps</text>
</g>
<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="400" y="146" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="510" y="164" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Chest</text>
</g>
<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="400" y="192" width="220" height="36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="510" y="210" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="14">Shoulders</text>
</g>
</svg>
